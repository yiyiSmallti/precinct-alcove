# Alcove bridge bundle (Alcove SPEC 3.1).
# - The SDK profile has no approval or question channel; this bundle answers
#   both through the Alcove client over the host-callback connection.
# - The SDK profile has no ask_user_question tool; add it.
# - Session logs must not ride along on model requests.
- id: session-log-deepseek
  disabled: true
- insert:
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'
    - id: alcove-bridge
      name: '@precinct/alcove-bridge'
# The providers Alcove's settings offer besides DeepSeek, each reading its key
# from the variable Alcove sets at launch (credentials.Provider.KeyEnv). The
# custom route exists only in a runtime started for a custom endpoint, whose
# address, protocol and model arrive in ALCOVE_CUSTOM_* variables.
# ALCOVE_ROUTE_PATCH ({route: fields}) sets fields of a route for this
# runtime: models, to declare one pi-ai's catalog does not list (the route
# then serves only it), or modelOverrides, to widen a model's window; its
# compat fields are merged into the route's own.
# A custom endpoint sends its instructions as a `system` message: pi-ai takes
# an address it does not know for OpenAI's own and uses the `developer` role
# for a reasoning model, which servers such as vLLM and SGLang (Vertex AI's
# DeepSeek among them) may reject with a 400 that ends the turn. Only the
# OpenAI protocols have that role (and that compat field): llm-pi-ai refuses
# the whole route when an anthropic-messages one sets it, and a plugin's
# engine then runs its tool model's work on the main model instead.
# OpenCode Go routes a conversation to one server, and keeps its prompt
# cache, by the x-opencode-session header; pi-ai's opencode-go provider sets
# it from the session id dsh passes with each call, and Go rejects a request
# without it.
# Every route also retries a step whose failure pi-ai could not classify
# (PI_AI_ERROR), besides dsh's default codes: that is mostly a broken stream,
# e.g. "malformed server-sent event JSON" from one bad SSE line, which
# otherwise ends a long task's turn on the spot. A failure that repeats still
# ends the turn once the retries run out. The waits grow from 2 s to 60 s over
# six retries (about two minutes in all): dsh's default of five retries from
# 0.5 s to 10 s gives up after some 20 s, while a rate limit (a 429 such as
# Vertex AI's RESOURCE_EXHAUSTED, counted per minute) can outlast that, and
# ending the turn loses a long task's progress.
- id: llm-pi-ai
  config:
    providers: !!js |-
      ((routes) => {
        const patch = JSON.parse(process.env.ALCOVE_ROUTE_PATCH || '{}');
        for (const [route, fields] of Object.entries(patch)) {
          if (!routes[route]) continue;
          const compat = fields.compat && { compat: { ...routes[route].compat, ...fields.compat } };
          routes[route] = { ...routes[route], ...fields, ...compat };
        }
        const retryPolicy = {
          mode: 'normal',
          maxRetries: 6,
          retryableCodes: ['EMPTY_RESPONSE', 'RATE_LIMIT', 'SERVER', 'TIMEOUT', 'TRANSPORT', 'PI_AI_ERROR'],
          backoff: { initialDelayMs: 2000, maxDelayMs: 60000 },
        };
        for (const route of Object.keys(routes)) {
          routes[route] = { retryPolicy, ...routes[route] };
        }
        return routes;
      })({
        openai: { apiKeyEnv: 'OPENAI_API_KEY' },
        anthropic: { apiKeyEnv: 'ANTHROPIC_API_KEY' },
        google: { apiKeyEnv: 'GEMINI_API_KEY' },
        xai: { apiKeyEnv: 'XAI_API_KEY' },
        openrouter: { apiKeyEnv: 'OPENROUTER_API_KEY' },
        'opencode-go': { apiKeyEnv: 'OPENCODE_API_KEY' },
        'moonshotai-cn': { apiKeyEnv: 'MOONSHOT_API_KEY' },
        'zai-coding-cn': { apiKeyEnv: 'ZAI_CODING_CN_API_KEY' },
        'qwen-token-plan-cn': { apiKeyEnv: 'QWEN_TOKEN_PLAN_CN_API_KEY' },
        'minimax-cn': { apiKeyEnv: 'MINIMAX_CN_API_KEY' },
        xiaomi: { apiKeyEnv: 'XIAOMI_API_KEY' },
        mistral: { apiKeyEnv: 'MISTRAL_API_KEY' },
        groq: { apiKeyEnv: 'GROQ_API_KEY' },
        ...(process.env.ALCOVE_CUSTOM_BASE_URL && {
          custom: {
            displayName: '自定义',
            apiKeyEnv: 'ALCOVE_CUSTOM_API_KEY',
            api: process.env.ALCOVE_CUSTOM_API,
            baseURL: process.env.ALCOVE_CUSTOM_BASE_URL,
            ...(process.env.ALCOVE_CUSTOM_API?.startsWith('openai-') && { compat: { supportsDeveloperRole: false } }),
            models: [{ id: process.env.ALCOVE_CUSTOM_MODEL }],
          },
        }),
      })
# When a conversation is compacted: Alcove's settings, per runtime, as
# compaction-basic's own keys (auto, thresholdRatio, retainRatio).
- id: compaction-basic
  config: !!js JSON.parse(process.env.ALCOVE_COMPACTION || '{}')
# Agents a runtime makes on its own (a plugin's engine such as the daily
# bot's, subagents) take dsh's default model, dsh-base's DeepSeek route,
# for which Alcove holds no key unless the user chose DeepSeek: set it to
# the route Alcove launched the runtime on (ALCOVE_DEFAULT_MODEL).
- id: agent-default-model
  config: !!js |-
    JSON.parse(process.env.ALCOVE_DEFAULT_MODEL || '{"provider":"deepseek-official","model":"deepseek-flash"}')
# The personal context (Alcove SPEC 3.1, internal/core/personal): Alcove sets
# ALCOVE_PERSONAL_HOME only for the runtime of a personal workspace. There its
# skills/ is one more skill folder, after the project's own; its AGENTS.md
# (what the agent should know about the user) is added by the bridge plugin
# as runtime context, since dsh reads user-level AGENTS.md only from its
# process homes. An org workspace or a plugin's runtime gets neither, so
# what Alcove learned about the user never goes out through an org's gateway.
- id: skill-filesystem
  config: !!js |-
    (process.env.ALCOVE_PERSONAL_HOME
      ? { customSkillDirs: [process.env.ALCOVE_PERSONAL_HOME + (process.platform === 'win32' ? '\\' : '/') + 'skills'] }
      : {})
